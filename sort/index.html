<style>

}
body.light{--bg:#efece6; --panel:#fbfaf8; --line:#d3cfc5; --ink:#1a1b1e; --mute:#7c7a74; --soft:#4a4a48; --chip:#e9e6de}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:relative;overflow:hidden;background:var(--bg);container-type:size}
#zoom{position:absolute;inset:0;will-change:transform}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;pointer-events:none}

/* header: brand line + editorial title, like a real app page */
#head{left:var(--padx);top:var(--heady);right:var(--padx);display:flex;align-items:center;gap:1.4cqh}
#logo{width:var(--logo);height:var(--logo);border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:calc(var(--logo)*.5);flex:none}
#brand{font-size:var(--fbrand);color:var(--mute);letter-spacing:.08em}
#title{font-family:var(--serif);font-weight:900;font-size:var(--ftitle);line-height:1.15;letter-spacing:.01em;white-space:nowrap}
#title i{font-family:"Instrument Serif",var(--serif);font-weight:400;font-style:italic;color:var(--mute);font-size:1.12em;letter-spacing:0;padding:0 .32em 0 .26em}
#phase{right:var(--padx);top:calc(var(--heady) + .4cqh);display:flex;gap:1cqh;transition:opacity .4s}
#phase span{font-family:var(--disp);font-stretch:112%;font-weight:600;font-size:var(--fphase);letter-spacing:.18em;color:var(--mute);opacity:.45;padding-bottom:.45cqh;border-bottom:2px solid transparent;transition:all .35s}
#phase span.on{opacity:1;color:var(--ink);border-color:var(--ink)}
#phase span.done{opacity:.8}

#hero{left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;transition:opacity .45s}
#hero .box{display:inline-block;padding:2.6cqh 5cqh 3cqh;border-radius:3.2cqh;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);box-shadow:0 3cqh 9cqh rgba(0,0,0,.45)}
#hero .n{font-family:var(--disp);font-stretch:70%;font-weight:900;font-size:var(--fhero);line-height:.84;font-variant-numeric:tabular-nums}
#hero .w{font-family:var(--disp);font-stretch:125%;font-weight:700;font-size:calc(var(--fhero)*.15);letter-spacing:.5em;margin-right:-.5em;margin-top:1.2cqh}
#hero .s{font-size:calc(var(--fhero)*.085);color:var(--soft);margin-top:1.3cqh;letter-spacing:.06em}

#cap{left:0;right:0;text-align:center;font-size:var(--fcap);color:var(--soft);letter-spacing:.06em;opacity:0;transition:opacity .35s}
#cap .pill{display:inline-block;padding:.7cqh 1.8cqh;border-radius:999px;background:color-mix(in srgb,var(--bg) 78%,transparent);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#cap b{font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);margin-right:.6em}
#fin{left:0;right:0;text-align:center;opacity:0;transform:translateY(1cqh);transition:opacity .6s,transform .8s cubic-bezier(.2,.9,.2,1)}

.ui{transition:opacity .35s}

.row .m{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}

#drop{position:fixed;inset:0;z-index:20;overflow:auto;background:#0c0d10;color:#f2f0ea;font-family:var(--body)}
#drop[hidden]{display:none}
.lp{max-width:720px;margin:0 auto;padding:28px 22px 64px}

.lpn a{color:#c9ccd3;text-decoration:none}.lpn a:hover{color:#fff}
.lsw{display:inline-flex;padding:3px;border:1px solid #3a3e48;border-radius:10px;gap:2px}
.lsw button{border:0!important;border-radius:7px!important;padding:6px 12px!important;font-size:13px!important;font-weight:700;color:#aeb2bb!important}
.lsw button[aria-pressed="true"]{background:#f2f0ea;color:#0c0d10!important}
.lpn button,.lpb button{font-size:14px;padding:9px 16px;border-radius:999px;border:1px solid #3a3e48;color:#f2f0ea}

.lps{list-style:none;counter-reset:s;margin:34px 0 26px;display:grid;gap:14px}
.lps li{counter-increment:s;position:relative;padding:20px 20px 20px 64px;border:1px solid #2b2e36;border-radius:16px;background:#15171c}

.lpp{font-size:13px;line-height:1.7;color:#8f939d;margin-top:26px}

<script type="text/plain" id="p-zh">要整理的資料夾：`把資料夾路徑貼在這裡`

請幫我整理這個資料夾。如果上面沒有路徑，或你找不到這個資料夾，請停下來問我，不要自己猜其他路徑。

## 第一步：全部讀過，什麼都不要動
- 計算檔案數量。只算最上層，除非我說要進子資料夾。略過檔名以點開頭的隱藏檔。
- 超過 500 個檔案時，先告訴我數量，問我是否全部處理。
- 打開每個檔案，讀裡面真正的內容。不要只看檔名或副檔名分類。
- 圖片和掃描的 PDF 請實際看內容。讀不了的格式直接說，不要假裝讀過。
- 分類由你根據內容決定，越少越好（通常 5 到 12 個），用繁體中文取簡短好懂的名稱。
- 檔名和內容矛盾時，以內容為準，並記錄檔名有誤導。
- 讀不了或沒把握的，放進 `review`（待確認）並寫下原因。
- 在我批准之前，不要移動、改名、修改或刪除任何東西。

## 第二步：寫出 classification.json
存在要整理的資料夾旁邊，不要放進資料夾裡。請完全照這個格式：

```json
{
  "source": "資料夾名稱",
  "lang": "zh",
  "moved": false,
  "unreadable": 0,
  "readMethods": { "全文讀取": 180, "看圖判讀": 40 },
  "categories": [
    { "id": "work", "name": "工作", "reason": "一句話說明這類放什麼" },
    { "id": "review", "name": "待確認", "reason": "讀不了，或沒有把握" }
  ],
  "files": [
    { "name": "完整檔名.pdf", "ext": "pdf", "cat": "work", "topic": "幾個字說明主題",
      "reason": "一句話：內容是什麼、為什麼放這類", "nameType": "match", "read": "全文讀取", "needsReview": false }
  ]
}
```

- 每個檔案都要出現，而且只出現一次。不可以有不存在的檔案。
- `cat` 必須是某個分類的 id；不確定的用 `review`。
- `nameType`：`match`（檔名符合內容）、`generic`（檔名沒資訊，例如「未命名」）、`conflict`（檔名指向別的主題）。
- 寫完自己檢查：`files` 筆數等於資料夾檔案數、沒有重複檔名。

## 第三步：給我看整理計畫，然後等我
簡短告訴我：找到幾個檔案、幾個讀不了；每個分類的數量和理由；`review` 裡每個檔案的原因；檔名與內容不符的檔案。
最後請我打開 https://fattybamba.com/sort/ ，把 classification.json 拖進去看整理動畫。

## 第四步：我說「批准搬移」才動檔案
- 在資料夾裡為每個分類建立一個資料夾，把檔案搬進去。
- 不可以刪除或覆蓋檔案；有同名衝突就停下來告訴我。不要碰這個資料夾以外的東西。
- 完成後重新計數核對，把 `"moved"` 改成 `true`，給我一份簡短報告。</script>
<script type="text/plain" id="p-en">Folder to sort: `PASTE THE FOLDER PATH HERE`

Please sort this folder for me. If the path above is missing or you can't find the folder, stop and ask me. Never guess a different path.

## Step 1. Read everything. Move nothing.
- Count the files. Top level only unless I say to go into subfolders. Skip hidden files (names starting with a dot).
- If there are more than 500 files, tell me the count and ask whether to do all of them.
- Open each file and read what is actually in it. Do not sort by file name or extension alone.
- Look at images and scanned PDFs. If you can't read a file type, say so. Never claim to have read something you could not read.
- Decide the categories yourself from the content. As few as make sense (usually 5 to 12), with short plain names.

    },

  };
})();

/* ---------- loop ---------- */
function frame(now) {

}

/* ---------- controls ---------- */
function start() { closeSheet(); T = 0; prevT = 0; t0 = performance.now(); playing = true; started = true; bins.forEach(b => b.flash = 0); try { audio.play(); } catch (e) { console.warn('audio unavailable', e); } }

    const tags = f.read ? [`<span class="tag">${esc(f.read)}</span>`] : [];

    if (f.nameType === 'generic') tags.push(`<span class="tag">${L('檔名無資訊', 'Uninformative name')}</span>`);
    tags.push(f.needsReview ? `<span class="tag q">${L('需要人工確認', 'Needs your review')}</span>` : `<span class="tag">${L('不需人工確認', 'No review needed')}</span>`);
    return `<div class="row"><span class="e">${esc(String(f.ext).toUpperCase().slice(0, 5))}</span><span class="f">${esc(f.name)}</span><span class="r">${esc(f.reason)}</span><span class="m">${tags.join('')}</span></div>`;
  }).join('') + (c.count > 400 ? `<p class="note">${L('只顯示前 400 個；完整清單在 classification.json。', 'Showing the first 400; the full list is in classification.json.')}</p>` : '');
  $('list').scrollTop = 0; $('sheet').classList.add('on');
}
function openOverview() {
  $('shT').textContent = L('分類總覽', 'Overview'); $('shC').textContent = N; $('shC').style.color = ''; $('shP').textContent = L(`來源 ${DATA.source}`, `Source: ${DATA.source}`) + (DATA.analyzedAt ? L('，分析於 ', ', analysed ') + String(DATA.analyzedAt).slice(0, 16).replace('T', ' ') : '');
  const max = Math.max(...CATS.map(c => c.count));
  $('list').innerHTML = `<div class="facts"><div><b>${N}</b>${L('實際掃描到的檔案', 'files scanned')}</div><div><b>${realCats}</b>${L('自動發現的分類', 'categories found')}</div><div><b>${reviewN}</b>${L('需要人工確認', 'need your review')}</div><div><b>${DATA.nameConflicts}</b>${L('檔名與內容不符，已依內容分類', 'names that did not match content')}</div><div><b>${DATA.genericNames}</b>${L('檔名無資訊（未命名、scan…）', 'uninformative names (untitled, scan…)')}</div><div><b>${DATA.unreadable}</b>${L('無法讀取', 'unreadable')}</div></div>
    <div class="ov">${CATS.map((c, i) => `<button data-i="${i}"><span class="nm"><i style="background:${c.color}"></i>${esc(EN && c.en ? c.en : c.name)}</span><span class="bar"><b style="width:${c.count / max * 100}%;background:${c.color}"></b></span><span class="ct">${c.count}</span></button>`).join('')}</div>
    <p class="note">${Object.keys(DATA.readMethods).length ? L('讀取方式：', 'How files were read: ') + Object.entries(DATA.readMethods).map(([k, v]) => `${esc(k)} ${v}`).join(L('、', ', ')) + L('。', '. ') : ''}${L('畫面上的掃描動畫是重播已完成的分類結果。', 'The scan on screen replays a finished sort. ')}${DATA.moved ? L('檔案已搬移。', 'Files have been moved.') : L('檔案尚未移動。', 'No files have been moved yet.')}</p>
    <p class="note">File Universe by 黑牛 Heiniu @fatty_bamba</p>`;
  $('list').querySelectorAll('button').forEach(b => b.onclick = () => openCat(+b.dataset.i));
  $('list').scrollTop = 0; $('sheet').classList.add('on');
}
function closeSheet() { $('sheet').classList.remove('on'); }
function setRec(v) { document.body.classList.toggle('rec', v); closeSheet(); if (v) { const h = $('recHint'); h.style.opacity = 1; setTimeout(() => h.style.opacity = 0, 2600); } }
const isRec = () => document.body.classList.contains('rec');
function pick(ev) { if (!started || T < T_SORT) return -1; const r = stage.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top; for (const b of bins) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.i; return -1; }
$('start').onclick = start; $('bReplay').onclick = start; $('bOver').onclick = openOverview; $('shX').onclick = closeSheet;
$('bSound').onclick = e => { const v = audio.toggle(); e.currentTarget.textContent = v ? L('音效 開', 'Sound on') : L('音效 關', 'Sound off'); e.currentTarget.setAttribute('aria-pressed', v); };
$('bTheme').onclick = e => { const v = document.body.classList.toggle('light'); e.currentTarget.setAttribute('aria-pressed', v); readTheme(); };
$('bFrame').onclick = e => { portraitFrame = !portraitFrame; e.currentTarget.setAttribute('aria-pressed', portraitFrame); layout(); };
$('bFull').onclick = () => { try { (document.fullscreenElement ? document.exitFullscreen() : $('wrap').requestFullscreen()).catch(() => { }); } catch (e) { } };
$('bRec').onclick = () => setRec(true);

cv.addEventListener('mousemove', e => { const h = isRec() ? -1 : pick(e); if (h !== hover) { hover = h; cv.style.cursor = h >= 0 ? 'pointer' : ''; } });
cv.addEventListener('click', e => { if (isRec()) { start(); return; } const h = pick(e); if (h >= 0) openCat(h); else closeSheet(); });
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (isRec()) setRec(false); else closeSheet(); }
  else if (e.key === ' ' || e.key === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON' && !isRec()) return; e.preventDefault(); start(); }
  else if (e.key === 'r' || e.key === 'R') setRec(!isRec());
  else if (e.key === 'f' || e.key === 'F') $('bFull').click();
  else if (e.key === 'm' || e.key === 'M') $('bSound').click();
  else if (e.key === 't' || e.key === 'T') $('bTheme').click();
});
addEventListener('resize', layout);

/* ---------- boot ---------- */
readTheme(); portraitFrame = false; layout(); buildSprites();
if (document.fonts && document.fonts.load) Promise.race([Promise.all([document.fonts.load('800 20px Archivo'), document.fonts.load('700 20px "Noto Sans TC"', '工作與專案檔')]), new Promise(r => setTimeout(r, 2500))]).then(buildSprites).catch(() => { });
window.__lang = l => { EN = l === 'en'; applyLang(); };
window.__reel = v => { reel = !!v; portraitFrame = true; layout(); };
window.__seek = t => { seekMode = t != null; if (seekMode) { T = t; amb = 3 + t; started = t > 0; playing = false; } };
window.__state = () => ({ T, playing, started, N, W, H, DPR, qScale, wide, audio: audio.state, cnt: { ...cnt, perCat: [...cnt.perCat] }, lastLand, binT, bins: bins.map(b => [b.cat.name, b.cat.count]) });
requestAnimationFrame(t => { last0 = t; requestAnimationFrame(frame); });
};
</script>
<script>
// Accepts whatever a sort produced and fills in anything missing, so the numbers on screen always come from the file list itself.
function normalize(d) {
  if (!d || !Array.isArray(d.files) || !d.files.length) throw new Error('classification.json needs a non-empty "files" array');
  const PAL = ['#5B8CFF', '#9B7BFF', '#FF5D8F', '#2DD4BF', '#38BDF8', '#34D399', '#FB923C', '#FBBF24', '#A3E635', '#E879F9', '#F87171', '#60A5FA', '#C084FC', '#4ADE80'];
  let cats = (Array.isArray(d.categories) ? d.categories : []).map(c => Object.assign({}, c, { id: String(c.id != null ? c.id : c.name) }));
  const byId = {}, byName = {}; cats.forEach(c => { byId[c.id] = c; if (c.name) byName[c.name] = c; });
  const files = d.files.map(f => {
    const name = String(f.name || f.file || f.filename || 'untitled'), m = /\.([A-Za-z0-9]{1,8})$/.exec(name);
    let cat = f.cat != null ? String(f.cat) : f.category != null ? String(f.category) : f.catName != null ? String(f.catName) : 'review';
    if (!byId[cat] && byName[cat]) cat = byName[cat].id;
    const needsReview = !!f.needsReview || cat === 'review';
    if (!byId[cat]) { const c = { id: cat, name: cat === 'review' ? '待確認' : cat, en: cat === 'review' ? 'Review' : undefined }; cats.push(c); byId[cat] = c; }
    return { name, ext: String(f.ext || (m ? m[1] : 'file')).toLowerCase(), cat, topic: String(f.topic || name.replace(/\.[^.]+$/, '')), summary: f.summary || '', reason: String(f.reason || ''),
      nameType: ['conflict', 'generic'].includes(f.nameType) ? f.nameType : 'match', read: f.read || '', needsReview };
  });
  cats.forEach(c => { const fs = files.filter(f => f.cat === c.id); c.count = fs.length;
    c.name = String(c.name || c.id); c.reason = String(c.reason || '');
    if (!Array.isArray(c.topics) || !c.topics.length) { const seen = {}; fs.forEach(f => seen[f.topic] = (seen[f.topic] || 0) + 1); c.topics = Object.keys(seen).sort((a, b) => seen[b] - seen[a]).slice(0, 8); } });
  cats = cats.filter(c => c.count > 0); const rv = cats.findIndex(c => c.id === 'review'); if (rv >= 0) cats.push(cats.splice(rv, 1)[0]);
  cats.forEach((c, i) => { if (!/^#[0-9a-fA-F]{6}$/.test(c.color || '')) c.color = c.id === 'review' ? '#94A3B8' : PAL[i % PAL.length]; });
  const byType = {}; files.forEach(f => byType[f.ext] = (byType[f.ext] || 0) + 1);
  return { source: String(d.source || 'Files'), title: d.title, brand: d.brand, lang: d.lang || (/^zh/i.test(navigator.language || '') ? 'zh' : 'en'), analyzedAt: d.analyzedAt || '', moved: !!d.moved,
    totalFiles: files.length, byType, readMethods: d.readMethods && typeof d.readMethods === 'object' ? d.readMethods : {}, unreadable: +d.unreadable || 0,
    nameConflicts: files.filter(f => f.nameType === 'conflict').length, genericNames: files.filter(f => f.nameType === 'generic').length, needsReview: files.filter(f => f.needsReview).length,
    categories: cats, files };
}
(function () {
  const $ = id => document.getElementById(id), drop = $('drop'), dz = drop.querySelector('.dz'), err = $('dzErr');
  // Same language choice as the rest of the site: ?lang= first, then the saved toggle, Chinese by default.
  const KEY = 'heiniu-language'; let en = false;
  try { const q = new URLSearchParams(location.search).get('lang'); en = q === 'en' || (q !== 'zh' && localStorage.getItem(KEY) === 'en'); } catch (e) { }
  window.__siteLang = v => { if (v != null) { en = !!v; try { localStorage.setItem(KEY, en ? 'en' : 'zh'); } catch (e) { } } return en; };
  const lang = () => { drop.querySelectorAll('[data-zh]').forEach(e => e.textContent = e.dataset[en ? 'en' : 'zh']);
    drop.querySelectorAll('.lsw button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.l === 'en') === en)));
    $('cpMain').textContent = en ? 'Copy the prompt' : '複製提示詞'; $('cpAlt').textContent = en ? '中文版提示詞' : 'English prompt'; $('cpOk').textContent = '';
    document.documentElement.lang = en ? 'en' : 'zh-Hant'; document.title = en ? 'AI Folder Sorter · File Universe | Heiniu' : 'AI 整理資料夾 · File Universe｜黑牛'; };
  const go = raw => { try { raw.lang = en ? 'en' : 'zh'; const d = normalize(raw); drop.hidden = true; window.__boot(d); } catch (e) { drop.hidden = false; err.textContent = e.message; } };
  if (DATA) return go(DATA);
  lang(); drop.hidden = false;
  drop.querySelectorAll('.lsw button').forEach(b => b.onclick = () => { window.__siteLang(b.dataset.l === 'en'); lang(); });
  const read = f => f && f.text().then(t => go(JSON.parse(t))).catch(e => { err.textContent = (en ? 'Could not read that file: ' : '讀不了這個檔案：') + e.message; });
  $('pick').onchange = e => read(e.target.files[0]);
  addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); }); addEventListener('dragleave', () => dz.classList.remove('over'));
  addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('over'); read(e.dataTransfer.files[0]); });
  $('demo').onclick = () => fetch('demo.json').then(r => r.json()).then(d => { if (en) { d.source = 'Demo: 300 test files'; d.brand = 'Heiniu · File Universe'; } go(d); }).catch(() => { err.textContent = en ? 'Could not load the demo.' : '示範資料載入失敗。'; });
  const copy = id => { const t = $(id).textContent.replace(/<\\\//g, '</'); const ok = () => { $('cpOk').textContent = en ? 'Copied. Paste it into Claude.' : '已複製，貼到 Claude 吧。'; };
    (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(t) : Promise.reject()).then(ok).catch(() => { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (e) { $('cpOk').textContent = en ? 'Copy failed. Select the text manually.' : '複製失敗，請手動選取。'; } a.remove(); }); };
  $('cpMain').onclick = () => copy(en ? 'p-en' : 'p-zh'); $('cpAlt').onclick = () => copy(en ? 'p-zh' : 'p-en');
})();
