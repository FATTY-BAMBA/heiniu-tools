name: Stage 2 responsive QA
on:
  push:
    branches: [codex/stage2-ux-accessibility]
permissions:
  contents: read
jobs:
  viewport-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b329842ea4e15e8598bec46988624da4058c2b75
          path: stage1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install playwright==1.56.0
      - run: python candidate/tests/responsive_qa.py stage1 candidate evidence
      - run: python candidate/tests/tool_qa.py candidate evidence
        if: success() || failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-responsive-evidence
          path: evidence
          retention-days: 7
