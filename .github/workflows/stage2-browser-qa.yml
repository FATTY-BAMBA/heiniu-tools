name: Stage 2 responsive QA
on:
  push:
    branches: [codex/stage2-ux-accessibility]
permissions:
  contents: read
jobs:
  viewport-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b329842ea4e15e8598bec46988624da4058c2b75
          path: stage1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Traditional Chinese screenshot font
        run: |
          font_dir="$HOME/.local/share/fonts/stage2-qa"
          mkdir -p "$font_dir"
          cd "$font_dir"
          curl --fail --location --retry 2 --max-time 45 --output NotoSansCJKtc-Regular.otf \
            https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf
          echo 'dce08bd4fd91aa8aa76ed8fea4b694c2dfb8550f67871e326843212ddbeb88b4  NotoSansCJKtc-Regular.otf' | sha256sum --check
          fc-cache "$font_dir"
      - run: python -m pip install playwright==1.56.0
      - run: python candidate/tests/responsive_qa.py stage1 candidate evidence
      - run: python candidate/tests/tool_qa.py candidate evidence
        if: success() || failure()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage2-responsive-evidence
          path: evidence
          retention-days: 7
