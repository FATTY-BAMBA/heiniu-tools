name: Stage 3 public content guardrails

on:
  push:
    branches:
      - codex/stage3-portfolio-evidence
  pull_request:
    paths:
      - 'index.html'
      - 'portfolio/**'
      - 'tests/content_consistency.py'
      - 'tests/stage3_routes_qa.py'
      - '.github/workflows/stage3-content-qa.yml'

permissions:
  contents: read

jobs:
  portfolio-claims:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public portfolio wording and bilingual markers
        run: python tests/content_consistency.py
      - name: Parse test source
        run: python -m py_compile tests/content_consistency.py tests/stage3_routes_qa.py
      - name: Install Chromium browser tests
        run: python -m pip install playwright==1.56.0
      - name: Run Stage 3 responsive and language checks
        run: python tests/stage3_routes_qa.py . evidence/stage3
      - name: Upload Stage 3 screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-browser-evidence
          path: evidence/stage3
          retention-days: 7
